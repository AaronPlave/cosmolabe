name: Prepare Node and SPICE test data
description: Checkout, restore sparse LFS test kernels when needed, and install Node dependencies
inputs:
  test-kernels:
    description: Fetch the sparse LFS kernel set used by Vitest and viewer smoke
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Cache LFS test kernels
      if: inputs.test-kernels == 'true'
      uses: actions/cache@v4
      with:
        path: .git/lfs
        key: lfs-test-kernels-${{ hashFiles('kernels/test-data/**', 'kernels/fixtures/**', 'apps/viewer/test-catalogs/kernels/cassini/**', 'apps/viewer/test-catalogs/kernels/de440s.bsp', 'apps/viewer/test-catalogs/kernels/msl/msl_surf_rover_tlm_0449_0583_v1.bc') }}

    - name: Smudge sparse test-kernel LFS files
      if: inputs.test-kernels == 'true'
      shell: bash
      # These five globs match the original PR CI set. In particular, do not
      # fetch all viewer kernels: the other mission catalogs are much larger.
      run: |
        git lfs install --local
        git lfs fetch --include "kernels/test-data/**,kernels/fixtures/**,apps/viewer/test-catalogs/kernels/cassini/**,apps/viewer/test-catalogs/kernels/de440s.bsp,apps/viewer/test-catalogs/kernels/msl/msl_surf_rover_tlm_0449_0583_v1.bc"
        git lfs checkout "kernels/test-data/**" "kernels/fixtures/**" "apps/viewer/test-catalogs/kernels/cassini/**" "apps/viewer/test-catalogs/kernels/de440s.bsp" "apps/viewer/test-catalogs/kernels/msl/msl_surf_rover_tlm_0449_0583_v1.bc"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

name: AI review loop

on:
  pull_request:
    types: [labeled, unlabeled, ready_for_review, converted_to_draft, reopened, synchronize, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to reconcile
        required: true
        type: number
      retry_current_head:
        description: Retry a missing or failed Work review without consuming a round
        required: false
        default: false
        type: boolean
      resume_after_human:
        description: Start a new three-round episode after human intervention
        required: false
        default: false
        type: boolean

concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      action: ${{ steps.loop.outputs.action }}
      head: ${{ steps.loop.outputs.head }}
      round: ${{ steps.loop.outputs.round }}
      review_comment_id: ${{ steps.loop.outputs.reviewCommentId }}
      pr_number: ${{ steps.pr.outputs.number }}
      head_ref: ${{ steps.loop.outputs.headRef }}
    steps:
      # Orchestration always comes from the protected default branch, never
      # from the untrusted pull-request head.
      - name: Checkout protected orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve pull request number
        id: pr
        env:
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: Reconcile current GitHub state
        id: loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHATGPT_REVIEW_LOGIN: ${{ vars.CHATGPT_REVIEW_LOGIN }}
          CLAUDE_BOT_LOGIN: ${{ vars.CLAUDE_BOT_LOGIN }}
          RETRY_CURRENT_HEAD: ${{ inputs.retry_current_head || 'false' }}
          RESUME_AFTER_HUMAN: ${{ inputs.resume_after_human || 'false' }}
        run: node .github/scripts/ai-review-loop.mjs

  remediate:
    needs: reconcile
    if: needs.reconcile.outputs.action == 'remediate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.reconcile.outputs.head_ref }}
          fetch-depth: 0
      - name: Revalidate head before invoking Claude
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.reconcile.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.reconcile.outputs.head }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          test "$current" = "$EXPECTED_HEAD"
      - name: Address blocking review findings
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ vars.CLAUDE_BOT_LOGIN }}
          claude_args: --max-turns 10
          prompt: |
            Fix only the blocking findings in the latest trusted ChatGPT review for PR #${{ needs.reconcile.outputs.pr_number }}, reviewed head ${{ needs.reconcile.outputs.head }}, round ${{ needs.reconcile.outputs.round }}.

            First verify the current head is still ${{ needs.reconcile.outputs.head }}; otherwise exit without editing. Keep changes scoped to those findings. Run targeted tests for touched code. Push one normal commit to the existing PR branch. Do not force-push, rebase, alter workflow files, change labels, approve, enable auto-merge, or merge.

            If a finding conflicts with established direction, repeats without resolution, tests remain broken, or the fix materially expands scope, do not push a speculative partial fix. Post this exact marker in a top-level PR comment, followed by a short reason:
            <!-- ai-loop:remediation {"schema":1,"reviewed_head":"${{ needs.reconcile.outputs.head }}","round":${{ needs.reconcile.outputs.round }},"status":"blocked"} -->

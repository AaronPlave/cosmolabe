name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Superseded PR commits cancel their own jobs, not nightly or other PRs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast PR CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install dependencies and sparse test kernels
        uses: ./.github/actions/ci-setup
        with:
          test-kernels: 'true'

      # Catch tracked LFS pointers that were left behind after changing
      # .gitattributes, rather than debugging invalid binary data downstream.
      - name: Check for stale git-lfs pointers
        run: bash scripts/check-lfs-pointers.sh

      - name: Purity lint (core and control import no renderer)
        run: npm run lint:purity

      - name: Lint
        run: npm run lint

      - name: Build packages
        run: npm run build

      # Package build excludes test files. The viewer TS and Svelte checks are
      # separate because tsc does not check the contents of .svelte files.
      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Typecheck viewer
        run: npm run typecheck:viewer

      - name: Typecheck svelte components
        run: npm run typecheck:svelte

      # Required by lro-validation.test.ts. Keep all fixture-dependent Vitest
      # coverage, rather than removing tests to make this job artificially fast.
      - name: Cache mission kernels
        uses: actions/cache@v4
        with:
          path: apps/viewer/test-catalogs/kernels/lro
          key: lro-kernels-${{ hashFiles('scripts/fetch-lro-kernels.sh') }}

      - name: Fetch LRO kernels
        run: bash scripts/fetch-lro-kernels.sh

      # Cosmographia's catalog is third-party test data, downloaded rather than
      # vendored. Both fixtures and the full Vitest suite stay on every PR.
      - name: Cache Cosmographia data
        uses: actions/cache@v4
        with:
          path: .cosmographia
          key: cosmographia-${{ hashFiles('scripts/fetch-cosmographia-data.sh') }}

      - name: Fetch Cosmographia data
        run: bash scripts/fetch-cosmographia-data.sh

      # Keep deterministic surface planning in the fast gate; GDAL rebuilds
      # and hosted acceptance belong to the path-filtered surface-builds job.
      - name: Run Vitest suite and surface planning tests
        run: |
          npm test -- --exclude scripts/surface-build.test.mjs
          npx vitest run --project scripts scripts/surface-build.test.mjs --testNamePattern '^finite locked surface build planning'

      - name: Replay MoonFall clearance against pinned hosted CPU terrain
        if: ${{ vars.DATA_BASE_URL != '' }}
        env:
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: |
          MOONFALL_GRIDS=$(node --input-type=module -e "import {loadDatasets,remotePrefix,joinUrl} from './scripts/data-hosting/lib/datasets.mjs'; console.log(joinUrl(process.env.DATA_BASE_URL, remotePrefix(loadDatasets().datasets['cube-terrain/moon-terrain-cube']) + 'cpu-grids.json'))")
          export MOONFALL_GRIDS
          npx vitest run --project scripts scripts/moonfall-clearance.test.mjs

      - name: Planetary nomenclature converter regressions
        run: python3 -m unittest discover -s scripts/__tests__ -p test_convert_planetary_nomenclature.py -v

  changes:
    name: Detect expensive-check changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      terrain: ${{ steps.filter.outputs.terrain }}
      surface: ${{ steps.filter.outputs.surface }}
      browser: ${{ steps.filter.outputs.browser }}
      stars: ${{ steps.filter.outputs.stars }}
      geographic: ${{ steps.filter.outputs.geographic }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # PR API comparisons include added/removed paths across every commit.
      # Conservative shared-renderer and CI-infrastructure fallbacks are
      # intentional. Skipped targeted jobs must not become required statuses.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terrain:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/ci/**'
              - '.gitattributes'
              - 'package.json'
              - 'package-lock.json'
              - 'apps/viewer/package.json'
              - 'apps/viewer/vite.config.ts'
              - 'scripts/terrain/**'
              - 'scripts/surface-build/worker.py'
              - 'scripts/surface-build/source_kernels.py'
              - 'scripts/build-mars-terrain/**'
              - 'scripts/build-moon-terrain/**'
              - 'scripts/build-*terrain*'
              - 'scripts/validate*terrain*'
              - 'scripts/plan-surface.mjs'
              - 'scripts/discover-surface.mjs'
              - 'packages/core/src/surface-plan/**'
              - 'packages/core/src/geographic/**'
              - 'apps/viewer/test-catalogs/data/**'
              - 'apps/viewer/test-catalogs/*terrain*.json'
              - 'apps/viewer/test-catalogs/*imagery*.json'
            surface:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/ci/**'
              - '.gitattributes'
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.config.*'
              - 'apps/viewer/package.json'
              - 'apps/viewer/vite.config.ts'
              - 'packages/core/**'
              - 'packages/three/**'
              - 'packages/frames/**'
              - 'packages/control/**'
              - 'packages/cspice-wasm/**'
              - 'packages/interop/**'
              - 'apps/viewer/src/lib/**'
              - 'apps/viewer/src/workers/**'
              - 'apps/viewer/src/App.svelte'
              - 'apps/viewer/src/main.ts'
              - 'apps/viewer/src/components/ImageryLayersSection.svelte'
              - 'apps/viewer/src/components/BodyInfoPanel.svelte'
              - 'apps/viewer/test-catalogs/experiments/mars-terrain-cube-jezero.json'
              - 'apps/viewer/test-catalogs/experiments/mars-surface-build-pilot.json'
              - 'scripts/surface-build/**'
              - 'scripts/surface-build.test.mjs'
              - 'scripts/build-surface.mjs'
              - 'scripts/terrain/**'
              - 'scripts/data-hosting/**'
              - 'scripts/test-surface-build*.mjs'
              - 'scripts/validate-cube-terrain.mjs'
              - 'docs/examples/surface-plans/**'
            # Any change to the shared scene engine, browser integration, or
            # infrastructure must exercise BOTH browser suites. Keep this broad:
            # new camera/scene files must not silently escape the smoke checks.
            browser:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/ci/**'
              - '.gitattributes'
              - 'package.json'
              - 'package-lock.json'
              - 'apps/viewer/package.json'
              - 'apps/viewer/vite.config.ts'
              - 'packages/core/src/**'
              - 'packages/three/**'
              - 'packages/frames/**'
              - 'packages/cspice-wasm/**'
              - 'packages/interop/**'
              - 'apps/viewer/src/lib/**'
              - 'apps/viewer/src/workers/**'
              - 'apps/viewer/src/App.svelte'
              - 'apps/viewer/src/main.ts'
              - 'apps/viewer/test-catalogs/**'
              - 'scripts/visual-regression.mjs'
            # Suites also run independently for changes to their own harness.
            stars:
              - 'scripts/test-starfield-webgl.mjs'
              - 'scripts/capture-starfield-calibration.mjs'
              - 'scripts/test-sun-viewer-gpu.mjs'
              - 'scripts/test-sun-terrain-gpu.mjs'
              - 'scripts/test-site-mesh-depth-gpu.mjs'
            geographic:
              - 'scripts/test-geographic*.mjs'
              - 'scripts/test-place*.mjs'
              - 'scripts/test-planetary-places.mjs'
              - 'scripts/lib/place-label-motion*.mjs'
              - 'scripts/prepare-natural-earth-countries.py'
  terrain:
    name: Targeted terrain fixtures
    needs: changes
    if: needs.changes.outputs.terrain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install offline raster tooling
        run: sudo apt-get update && sudo apt-get install -y python3-gdal python3-numpy
      - name: Run all terrain builder fixtures
        run: bash scripts/ci/run-terrain-fixtures.sh

  surface-builds:
    needs: changes
    if: needs.changes.outputs.surface == 'true'
    name: Surface build executor
    runs-on: ubuntu-24.04
    # Full-density SwiftShader acceptance plus rebuilds takes about 15 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/ci-setup
      - name: Install surface build raster tooling
        timeout-minutes: 5
        run: |
          # Hosted runners may select Azure through a mirror list, not the sources file.
          for apt_source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends python3-gdal python3-numpy
      - run: npm run build
      - name: Install fixture browser
        run: npx playwright install --with-deps chromium
      - name: Verify executor prerequisites
        run: /usr/bin/python3 -c 'from osgeo import gdal; import numpy'
      - name: Surface build rebuild and publication regressions
        run: npx vitest run --project scripts scripts/surface-build.test.mjs
      - name: Hosted Skyfall fixture, planner report, catalog pin and rollback
        run: node scripts/surface-build/acceptance.mjs work/surface-build/skyfall-ci /usr/bin/python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-build-acceptance
          path: |
            work/surface-build/skyfall-ci/acceptance.json
            work/surface-build/skyfall-ci/report.json
            work/surface-build/skyfall-ci/published-planner-feedback.json
            work/surface-build/skyfall-ci/catalog-candidate.json
            work/surface-build/skyfall-ci/browser.log
            work/surface-build/skyfall-ci/viewer.log
            work/surface-build/skyfall-ci/browser/
          if-no-files-found: warn
          retention-days: 7

  stars:
    name: Targeted StarField WebGL and viewer
    needs: changes
    if: needs.changes.outputs.browser == 'true' || needs.changes.outputs.stars == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/ci-setup
        with:
          test-kernels: 'true'
      - name: Build packages
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: StarField readback and normal-viewer calibration
        run: bash scripts/ci/run-viewer-smoke.sh stars pr
      - name: Site mesh and solar depth GPU regressions
        run: |
          node scripts/test-sun-viewer-gpu.mjs
          node scripts/test-sun-terrain-gpu.mjs
          node scripts/test-site-mesh-depth-gpu.mjs /tmp/site-mesh-depth
      - name: Upload StarField evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-starfield
          path: |
            /tmp/starfield-webgl/
            /tmp/starfield-viewer/
            /tmp/viewer-smoke-vite.log
            /tmp/site-mesh-depth/
            work/sun-rendering/
          if-no-files-found: ignore
          retention-days: 7

  geographic:
    name: Targeted geographic viewer smoke
    needs: changes
    if: needs.changes.outputs.browser == 'true' || needs.changes.outputs.geographic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/ci-setup
        with:
          test-kernels: 'true'
      - name: Build packages
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Global geographic viewer smoke
        run: bash scripts/ci/run-viewer-smoke.sh geographic pr
      - name: Upload geographic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-geographic
          path: |
            /tmp/geographic-global-smoke/
            /tmp/planetary-places/
            /tmp/planetary-place-inspector/
            /tmp/planetary-places-motion/
            /tmp/planetary-place-targets/
            /tmp/viewer-smoke-vite.log
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terrain-fixtures:
    name: Terrain builder fixtures
    # Pin raster dependencies to the same supported LTS as browser checks.
    runs-on: ubuntu-24.04
    # Raster mirror downloads can consume most of ten minutes before fixtures start.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install offline raster tooling
        run: sudo apt-get update && sudo apt-get install -y python3-gdal python3-numpy
      - name: Oblate and below-reference Cartesian fixtures
        run: /usr/bin/python3 scripts/terrain/test_cube_ellipsoid.py
      - name: Existing lunar and cube builder fixtures
        run: /usr/bin/python3 scripts/terrain/dem.py selftest

  build-and-test:
    name: Build & Test
    # Playwright 1.60 cannot install Chromium dependencies on Ubuntu 26.04.
    # Keep the browser smoke on a supported image rather than the moving alias.
    runs-on: ubuntu-24.04
    # Include cold browser dependencies plus all software-rendered acceptance gates.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache LFS test kernels
        id: lfs-cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-test-kernels-${{ hashFiles('kernels/test-data/**', 'kernels/fixtures/**', 'apps/viewer/test-catalogs/kernels/cassini/**', 'apps/viewer/test-catalogs/kernels/de440s.bsp', 'apps/viewer/test-catalogs/kernels/msl/msl_surf_rover_tlm_0449_0583_v1.bc', 'apps/viewer/test-catalogs/textures/mars.dds') }}

      - name: Smudge test-kernel LFS files
        # See deploy-pages.yml for why we install + fetch + checkout
        # explicitly. Sparse fetch keeps the test job's LFS bandwidth tiny.
        #
        # Five paths are needed: mission integration suites read kernels/test-data/,
        # the cspice-wasm, frames and interop suites read the shared
        # kernels/fixtures/ (*.bsp and *.bc are LFS-routed there too), core's
        # oem-demo-fidelity suite reads the viewer's Cassini SOI SPK as its
        # SPICE truth reference, and lro-validation furnishes de440s.bsp for
        # the Moon's position relative to the solar-system barycentre.
        #
        # The viewer include stays scoped to cassini/ (4.8 MB) rather than the
        # whole test-catalogs/kernels/ tree (~150 MB: mar099s, europa-clipper),
        # which is the point of a sparse fetch. Add a sibling path here when a
        # test starts needing one — the harness now fails with "is a git-lfs
        # pointer, not a kernel" when that step is missed.
        #
        # Paths are given as `dir/**` globs, not `dir/`: git-lfs 3.4 accepts a
        # bare directory silently and checks out nothing, which would leave
        # pointers in place. SPICE ignores text outside \begindata, so furnish
        # would otherwise accept the pointer and load nothing, failing much
        # later with SPICE(NOLOADEDFILES).
        #
        # The fifth path is one file, not a directory: the frames reference regression
        # suite checks CK coverage on a second mission (issue #39) and needs
        # only the MSL rover telemetry CK (335 KB), not the rest of msl/, which
        # is 70 MB of Mars ephemeris no test here touches.
        #
        # de440s.bsp is smudged rather than downloaded: it is already
        # committed as an LFS object, so one glob entry costs 33 MB once and
        # nothing after (the cache above covers it), where
        # scripts/fetch-kernels.sh would pull 94 MB from NAIF — 62 MB of that
        # an asteroid SPK no test touches.
        # The named-place browser smoke also needs the Mars base texture.
        # Materialize this one LFS asset so CI exercises the unchanged real scene.
        run: |
          git lfs install --local
          git lfs fetch --include "kernels/test-data/**,kernels/fixtures/**,apps/viewer/test-catalogs/kernels/cassini/**,apps/viewer/test-catalogs/kernels/de440s.bsp,apps/viewer/test-catalogs/kernels/msl/msl_surf_rover_tlm_0449_0583_v1.bc,apps/viewer/test-catalogs/textures/mars.dds"
          git lfs checkout "kernels/test-data/**" "kernels/fixtures/**" "apps/viewer/test-catalogs/kernels/cassini/**" "apps/viewer/test-catalogs/kernels/de440s.bsp" "apps/viewer/test-catalogs/kernels/msl/msl_surf_rover_tlm_0449_0583_v1.bc" "apps/viewer/test-catalogs/textures/mars.dds"

      - name: Check for stale git-lfs pointers
        # A .gitattributes narrowing does not re-stage blobs committed while the
        # old rule was live, so the file keeps serving its ~130-byte pointer and
        # ships as ASCII wearing a binary's name. Cheap, and it runs before the
        # build so the failure names the file rather than surfacing as a corrupt
        # binary much later.
        run: bash scripts/check-lfs-pointers.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # core importing nothing from three or cesium is a property the embed
      # targets need and M-0001 ratified core on, held until now only by habit
      # and a sentence in CONTRIBUTING.md (#7). tsc cannot check it: both
      # packages are hoisted to the root node_modules by the workspace, so the
      # import would resolve and build green. `control` is held to the same rule
      # — it is the contract an embed host programs against, and the point of a
      # port is that it names no implementation.
      #
      # The DOM half of the property is not here — each package's tsconfig.json
      # drops "DOM" from lib, so the build step below rejects `document` on its
      # own. Its own step rather than folded into `npm run lint`: a grep over
      # import specifiers is simpler to audit than an eslint rule, and a failure
      # here names the property it protects.
      - name: Purity lint (core and control import no renderer)
        run: npm run lint:purity

      # eslint over packages/ and apps/ (eslint.config.mjs; #11, #25). Needs
      # no build output, so it runs before the build and fails fast.
      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      # Separate from `build`: the per-package projects emit the shipped
      # library and several exclude their suites, so the tests are only
      # typechecked here. Runs after build because it resolves cross-package
      # imports through each package's built dist types.
      - name: Typecheck tests
        run: npm run typecheck:tests

      # apps/viewer was in no gate at all — not typechecked, not tested, not
      # built on any PR (issue #20) — which is how its camera-view-io.ts kept
      # the noon-UTC J2000 constant through both #3 and #22. Covers the app's
      # own .ts; the .svelte half is the step below.
      - name: Typecheck viewer
        run: npm run typecheck:viewer

      # The other half of apps/viewer: plain `tsc` cannot see inside `.svelte`,
      # so the components were still ungated after typecheck:viewer. Measured at
      # 0 errors and 0 warnings when it was turned on, so it starts green and
      # `--fail-on-warnings` keeps it that way.
      - name: Typecheck svelte components
        run: npm run typecheck:svelte

      # lro-validation.test.ts reads an LRO reconstructed-orbit SPK that is not
      # committed. deploy-pages.yml has fetched it from NAIF since April, so the
      # download is already proven on the runner — this workflow simply never
      # ran the step, which is why that test has failed every CI run.
      #
      # Fetching beats committing it: NAIF is plain HTTPS, so it costs no
      # git-lfs bandwidth at all, which is the whole point of the sparse smudge
      # above. Cached on the script's own hash so repeat runs cost no network.
      - name: Cache mission kernels
        uses: actions/cache@v4
        with:
          path: apps/viewer/test-catalogs/kernels/lro
          key: lro-kernels-${{ hashFiles('scripts/fetch-lro-kernels.sh') }}

      - name: Fetch LRO kernels
        run: bash scripts/fetch-lro-kernels.sh

      # Two suites read Cosmographia's own catalog data as third-party
      # fixtures. Fetched, never vendored: that repo has no LICENSE file and no
      # license statement, so committing its data here would be a rights
      # question we cannot answer, while downloading it at test time is not.
      # A sparse partial clone takes ~9 MB of its 322 MB data tree.
      - name: Cache Cosmographia data
        uses: actions/cache@v4
        with:
          path: .cosmographia
          key: cosmographia-${{ hashFiles('scripts/fetch-cosmographia-data.sh') }}

      - name: Fetch Cosmographia data
        run: bash scripts/fetch-cosmographia-data.sh

      - name: Run tests
        run: npm test

      - name: Planetary nomenclature converter regressions
        run: python3 -m unittest discover -s scripts/__tests__ -p test_convert_planetary_nomenclature.py -v

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: StarField WebGL readback
        run: npm run test:stars:webgl

      - name: Normal-viewer geographic and planetary place smoke
        env:
          DEV_DATA_MODE: local
          CL_SMOKE: '1'
          CL_FRAMES: '1'
          CL_VIEWER_URL: http://127.0.0.1:5188/
          CL_OUTPUT: /tmp/geographic-global-smoke
        run: |
          npm --prefix apps/viewer run dev -- --host 127.0.0.1 --port 5188 --strictPort > /tmp/geographic-global-vite.log 2>&1 &
          VIEWER_PID=$!
          trap 'kill "$VIEWER_PID"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5188/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-geographic-global.mjs
          CL_OUTPUT=/tmp/planetary-places node scripts/test-planetary-places.mjs
          CL_OUTPUT=/tmp/planetary-places-motion node scripts/test-place-label-motion.mjs
          CL_OUTPUT=/tmp/planetary-place-targets node scripts/test-place-targets.mjs
          CL_OUTPUT=/tmp/planetary-place-inspector node scripts/test-place-inspector.mjs
          CL_STAR_SMOKE=1 npm run capture:stars

      - name: Save global geographic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geographic-global-smoke
          path: |
            /tmp/geographic-global-smoke/
            /tmp/planetary-places/
            /tmp/planetary-places-motion/
            /tmp/planetary-place-targets/
            /tmp/planetary-place-inspector/
            /tmp/geographic-global-vite.log
          if-no-files-found: ignore

      - name: Save StarField WebGL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfield-webgl
          path: |
            /tmp/starfield-webgl/
            /tmp/starfield-viewer/
          if-no-files-found: ignore

name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build viewer
    runs-on: ubuntu-latest
    # A cold Rosetta kernel build (download + rebuild, ~25 min) fits; a warm one
    # comes from the cache below.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache LFS objects
        id: lfs-cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-deploy-${{ hashFiles('apps/viewer/test-catalogs/**', 'docs/img/**', 'packages/spice/test-kernels/**') }}

      - name: Smudge LFS files
        # actions/checkout with lfs:false does not register the LFS smudge
        # filter — `git lfs install --local` makes it active. fetch then
        # downloads any missing OIDs (skipping those already in the restored
        # cache); checkout rewrites pointer files in the working tree.
        run: |
          git lfs install --local
          git lfs fetch
          git lfs checkout

      - name: Verify LFS smudge
        # Fail loudly if any tracked LFS file is still a pointer text file —
        # otherwise vite copies the 130-byte pointer into dist and browsers
        # serve plaintext under .jpg/.png URLs.
        run: |
          pointers=$(git lfs ls-files -n | xargs -I{} sh -c '
            f="$1"
            if [ -f "$f" ] && head -c 50 "$f" 2>/dev/null | grep -q "git-lfs.github.com"; then
              echo "$f"
            fi
          ' _ {})
          if [ -n "$pointers" ]; then
            echo "::error::Unsmudged LFS pointers found:"
            echo "$pointers"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Cache Rosetta kernel set
        # scripts/fetch-rosetta-kernels.sh downloads ~700 MB from the ESA
        # archive and spends ~20 min rebuilding the dense trajectory and
        # attitude files. Its output is a pure function of the scripts that
        # make it, so it is cached on them; the script skips what is present.
        uses: actions/cache@v4
        with:
          path: apps/viewer/test-catalogs/kernels/rosetta
          key: rosetta-kernels-${{ hashFiles('scripts/fetch-rosetta-kernels.sh', 'scripts/resample-spk.mjs', 'scripts/thin-ck.mjs', 'packages/cspice-wasm/wasm/cspice.wasm') }}

      - name: Fetch viewer kernels
        run: bash scripts/fetch-all.sh

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build viewer
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          # The public deployment offers the repository's examples through the
          # same catalog-source mechanism any deployment uses (issue #93). The
          # viewer lists nothing unless told to. docs/catalog-sources.md.
          VITE_CATALOG_SOURCES: '[{"id":"examples","name":"Examples","indexUrl":"index.json"}]'
        working-directory: apps/viewer
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/viewer/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
